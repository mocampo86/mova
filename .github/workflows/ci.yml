name: CI

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            backend:
              - 'src/ReservaCanchas.Api/**'
              - 'src/ReservaCanchas.Application/**'
              - 'src/ReservaCanchas.Domain/**'
              - 'src/ReservaCanchas.Infrastructure/**'
              - 'src/ReservaCanchas.Contracts/**'
              - 'tests/**'
              - 'ReservaCanchas.slnx'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/reservacanchas-web/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend build and test
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: reservacanchas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservacanchas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ReservaCanchas.slnx

      - name: Build
        run: dotnet build ReservaCanchas.slnx --no-restore

      - name: Test
        run: dotnet test ReservaCanchas.slnx --no-build --verbosity normal

  frontend:
    name: Frontend build and test
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/reservacanchas-web
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/reservacanchas-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
